# AInsight Pro - KOL 资产库
# 支持 200+ AI 领域 KOL 的批量导入
#
# 字段说明:
#   handle: 唯一标识 (Twitter @handle 或 GitHub username)
#   name: 显示名称
#   platform: 平台 (x/github/blog)
#   tier: 等级 (god/expert/insider/observer)
#   role: 角色 (researcher/engineer/founder/investor/journalist/educator/analyst/influencer)
#   category: 关注领域 (llm/cv/robotics/infra/product/research/startup/general)
#   weight: 聚类权重 (0.1-10.0, 默认 1.0)
#   rss_url: RSS 订阅地址 (可选，支持 Nitter/RSSHub)
#   bio: 简介
#   tags: 标签列表

# ==================== Nitter 实例配置 ====================
nitter:
  # 公共实例列表 (按优先级排序)
  instances:
    - "https://nitter.privacydev.net"
    - "https://nitter.poast.org"
    - "https://nitter.woodland.cafe"
    - "https://nitter.1d4.us"
    - "https://nitter.kavin.rocks"
  # RSS 路径模板: {instance}/{handle}/rss
  rss_template: "{instance}/{handle}/rss"
  timeout: 15
  retry: 3

