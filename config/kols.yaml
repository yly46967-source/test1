# ==================== 导入设置 ====================
import_settings:
  # 是否覆盖已存在的 KOL
  overwrite_existing: false
  # 是否自动生成 Nitter RSS URL
  auto_generate_nitter_url: true
  # 默认 Nitter 实例
  default_nitter_instance: "https://nitter.privacydev.net"
  # 是否启用新导入的 KOL
  enable_on_import: true
